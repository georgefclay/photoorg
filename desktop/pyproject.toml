[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoarchive"
version = "0.0.1"
description = "Family photo archive desktop app (ingest, triage, dedupe, cleanup, faces, sync)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6",
  # Pillow 13 refuses fromarray(mode="I;16") on a uint16 greyscale array,
  # which is how Cleanup saves 16-bit TIFFs (render._save). PROJECT-PLAN §5
  # item 27 — lift the cap once render.py handles 13.
  "Pillow<13",
  "pillow-heif",
  "imagehash",
  "psycopg[binary,pool]",
  "natsort",
  "pydantic",
  "pydantic-settings",
  "exifread",
  "piexif",
  "numpy",
  "scipy",
  "opencv-python-headless<5",
  "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photoarchive = ["modes/metadata/*.config"]
